version: '3.8'

services:
  # Nuxt3 应用服务
  nuxt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt3-app
    restart: always
    environment:
      - NODE_ENV=production
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    networks:
      - nuxt-network
    ports:
      - '3000:3000'
